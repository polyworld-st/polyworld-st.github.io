<title>POLYWORLD — Predict What's Next</title>
<style>
:root{--ink:#101a2d;--blue:#1769ff;--dark:#0a172b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#eef3f9}
button,a{font:inherit}
.stage{width:100%;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;overflow:visible;background:radial-gradient(circle at 50% 45%,#fff 0,#edf3fa 72%,#e1e9f4 100%);padding:0}
.art{position:relative;width:min(100vw,711px);height:auto;aspect-ratio:711/1536;overflow:visible;flex:none;background:#f6f9fd;box-shadow:0 0 80px rgba(30,55,95,.14);container-type:inline-size}
.base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}

/* The supplied artwork is the visual master. Functional campaign elements are real HTML. */
/* Top-right hamburger is already removed from the source artwork. */

/* Clean promo area: covers the old decorative/dashed artwork and replaces it with a real text field. */
.promo-cover{position:absolute;z-index:5;pointer-events:none;left:4.55%;top:58.35%;width:90.9%;height:14.15%;
  border-radius:18px;background:linear-gradient(180deg,rgba(247,250,253,.985),rgba(244,248,252,.985));
  box-shadow:0 5px 18px rgba(37,62,96,.04);}
.promo-panel{position:absolute;z-index:20;left:7.7%;top:59.05%;width:84.8%;height:9.0%;
  border-radius:clamp(12px,2.25cqw,16px);background:#0d1a31;border:1px solid rgba(105,145,202,.42);
  box-shadow:0 10px 24px rgba(12,36,75,.12);padding:0 4.7%;
  display:flex;flex-direction:column;justify-content:center;gap:0.45cqw;}
.promo-label{color:#8ea2c2;font-size:clamp(6px,1.28cqw,10px);letter-spacing:.19em;font-weight:760;line-height:1;}
.promo-row{display:flex;align-items:center;gap:1.4cqw;width:100%;min-width:0}
.promo-input{flex:1;min-width:0;height:clamp(32px,7.8cqw,48px);border:0;outline:0;background:transparent;color:#fff !important;
  -webkit-text-fill-color:#fff;
  padding:0;font-size:clamp(18px,5.8cqw,36px);line-height:1;font-weight:900;letter-spacing:.01em;
  font-family:inherit;user-select:text;-webkit-user-select:text;cursor:text;caret-color:transparent;}
.copy-btn{flex:none;height:clamp(30px,6.0cqw,43px);padding:0 clamp(9px,2.0cqw,14px);border:1px solid rgba(255,255,255,.18);border-radius:clamp(9px,1.55cqw,11px);background:rgba(255,255,255,.10);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:clamp(5px,1.0cqw,7px);font-size:clamp(8px,1.65cqw,12px);font-weight:800;letter-spacing:.08em;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .12s ease}
.copy-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.28)}
.copy-btn:active{transform:scale(.97)}
.copy-btn svg{width:clamp(12px,2.0cqw,14px);height:clamp(12px,2.0cqw,14px);display:block}
.copy-btn.copied{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3)}
.promo-input::selection{background:rgba(89,140,255,.55);color:#fff}
.promo-input::-moz-selection{background:rgba(89,140,255,.55);color:#fff}
.promo-note{display:none;position:absolute;z-index:6;left:10%;top:69.55%;width:80%;text-align:center;color:#7182a0;
  font-size:clamp(6px,.9vw,10px);font-weight:600;letter-spacing:.01em;}

/* Real registration link, placed over the approved CTA artwork. */
.cta-hit{position:absolute;z-index:7;left:4.4%;top:85.15%;width:91.2%;height:6.4%;
  border-radius:18px;display:block;cursor:pointer;outline:none}
.cta-hit:focus-visible{box-shadow:0 0 0 3px rgba(23,105,255,.7)}
.cta-hit:after{content:"";position:absolute;inset:-3px;border-radius:20px;animation:pulse 3s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.12;box-shadow:0 0 0 0 rgba(66,124,255,0)}50%{opacity:.75;box-shadow:0 0 22px 3px rgba(66,124,255,.18)}}

</style>
<style id="promo-interaction-fix">
  #promoCode, #copyBtn {
    position: relative !important;
    z-index: 99999 !important;
    pointer-events: auto !important;
    -webkit-user-select: text !important;
    user-select: text !important;
  }
  #copyBtn { cursor: pointer !important; touch-action: manipulation !important; }
</style>

<script id="click-tracking">
(function () {
  var CTA_URL = "https://polyworld.st/";
  var STORAGE_KEY = "polyworld_clickid";
  var cta = document.getElementById("cta");

  function validClickId(value) {
    if (!value) return false;
    value = String(value).trim();
    if (!value || value === "${SUBID}" || value.indexOf("${") === 0) return false;
    return true;
  }

  function getClickId() {
    var params = new URLSearchParams(window.location.search);
    var id = params.get("pbclick");
    if (validClickId(id)) return id;

    try {
      id = sessionStorage.getItem(STORAGE_KEY);
      if (validClickId(id)) return id;
    } catch (e) {}

    try {
      id = localStorage.getItem(STORAGE_KEY);
      if (validClickId(id)) return id;
    } catch (e) {}

    return "";
  }

  function saveClickId(id) {
    if (!validClickId(id)) return;
    try { sessionStorage.setItem(STORAGE_KEY, id); } catch (e) {}
    try { localStorage.setItem(STORAGE_KEY, id); } catch (e) {}
  }

  function buildCtaUrl() {
    var id = getClickId();
    var url = new URL(CTA_URL);
    if (id) url.searchParams.set("pbclick", id);
    return url.toString();
  }

  var params = new URLSearchParams(window.location.search);
  var incoming = params.get("pbclick");
  if (validClickId(incoming)) saveClickId(incoming);

  if (cta) {
    cta.href = buildCtaUrl();
    cta.addEventListener("click", function () {
      cta.href = buildCtaUrl();
    }, {passive:true});
  }
})();
</script>

<script id="promo-copy-final">
(function () {
  var CODE = "BOOST2026";
  var input = document.getElementById("promoCode");
  var button = document.getElementById("copyBtn");
  var copyText = document.getElementById("copyText");
  if (!input || !button) return;

  input.value = CODE;

  function showCopied(ok) {
    if (copyText) copyText.textContent = ok ? "COPIED" : "SELECTED";
    button.classList.add("copied");
    setTimeout(function () {
      if (copyText) copyText.textContent = "COPY";
      button.classList.remove("copied");
    }, 1400);
  }

  function fallbackCopy() {
    var ta = document.createElement("textarea");
    ta.value = CODE;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    ta.style.top = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, CODE.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function copyPromo(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }

    // On GitHub Pages/HTTPS this is the primary path.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(CODE).then(function () {
        showCopied(true);
      }).catch(function () {
        showCopied(fallbackCopy());
      });
      return;
    }

    showCopied(fallbackCopy());
  }

  // Inline-style direct handler in addition to addEventListener: this avoids
  // failures caused by event delegation/overlays in embedded previews.
  button.onclick = copyPromo;
  button.addEventListener("touchend", copyPromo, {passive:false});

  input.addEventListener("click", function (e) {
    e.stopPropagation();
    input.focus();
    input.select();
  });
})();
</script>
